#:schema https://www.schemastore.org/prek.json

default_install_hook_types = []
default_stages = ['manual', 'pre-commit', 'pre-push']

[auto_update]
cooldown_days = 3

[[repos]]
repo = 'meta'
hooks = [
  { id = 'check-hooks-apply' },
  { id = 'check-useless-excludes' }
]

[[repos]]
repo = 'https://github.com/pre-commit/pre-commit-hooks'
rev = 'v6.0.0'
hooks = [
  { id = 'check-added-large-files' },
  { id = 'check-case-conflict' },
  { id = 'check-executables-have-shebangs' },
  { id = 'check-illegal-windows-names' },
  { id = 'check-merge-conflict' },
  { id = 'check-shebang-scripts-are-executable' },
  { id = 'check-vcs-permalinks' },
  { id = 'end-of-file-fixer' },
  { id = 'fix-byte-order-marker' },
  { id = 'mixed-line-ending' },
  { id = 'trailing-whitespace' }
]

[[repos]]
repo = 'https://github.com/gitleaks/gitleaks'
rev = 'v8.30.1'
hooks = [
  { id = 'gitleaks' }
]

[[repos]]
repo = 'https://github.com/editorconfig-checker/editorconfig-checker'
rev = 'v3.8.0'
hooks = [
  { id = 'editorconfig-checker' }
]

[[repos]]
repo = 'https://github.com/streetsidesoftware/cspell-cli'
rev = 'v10.0.1'
hooks = [
  {
    id = 'cspell',
    args = [
      '--no-must-find-files',
      '--no-progress',
      '--no-summary',
      '--gitignore',
      '--cache',
      '--cache-location=.cache/cspell.json',
      '--files'
    ],
    stages = ['commit-msg', 'manual', 'pre-commit', 'pre-push']
  }
]

[[repos]]
repo = 'https://github.com/vale-cli/vale'
rev = 'v3.15.2'
hooks = [
  {
    id = 'vale',
    name = 'sync vale packages',
    args = ['--config=.vale/vale.ini', 'sync'],
    pass_filenames = false
  },
  {
    id = 'vale',
    name = 'check writing',
    shell = 'bash',
    # Print files for parsing errors and fail on warnings/suggestions.
    entry = '''
      output="$(vale --config=.vale/vale.ini $@ 2>&1 || :)"
      if [[ "$output" =~ E[0-9]+ ]]; then
        printf "\n\e[4m%s\e[0m\n\n%s" "$*" "$output"
        exit 1
      fi
      pattern='[1-9][0-9]*\s(error|warning|suggestion)'
      if [[ "$output" =~ $pattern ]]; then
        echo "$output"
        exit 1
      fi
    ''',
    # F: Vale 3.15: Comments in .json and multiline inline tables in .toml.
    exclude = {
      glob = [
        '.devcontainer/devcontainer.json',
        'license.txt',
        'prek.toml'
      ]
    }
  }
]

[[repos]]
repo = 'https://github.com/DavidAnson/markdownlint-cli2'
rev = "v0.23.1"
hooks = [
  { id = 'markdownlint-cli2' }
]

[[repos]]
repo = 'https://github.com/adrienverge/yamllint'
rev = 'v1.38.0'
hooks = [
  {
    id = 'yamllint',
    args = [
      '--strict',
      '--config-data',
      '''
extends: default
rules:
  document-start: disable
  truthy: {check-keys: false}
'''
    ]
  }
]

[[repos]]
repo = 'https://github.com/python-jsonschema/check-jsonschema'
rev = '0.37.4'
hooks = [
  {
    id = 'check-jsonschema',
    additional_dependencies = ['json5'],
    args = [
      '--force-filetype=json5',
      '--schemafile=https://raw.githubusercontent.com/devcontainers/spec/refs/heads/main/schemas/devContainerFeature.schema.json'
    ],
    files = 'devcontainer-feature.json$'
  }
]

[[repos]]
repo = 'https://github.com/shellcheck-py/shellcheck-py'
rev = 'v0.11.0.1'
hooks = [
  { id = 'shellcheck' }
]

[[repos]]
repo = 'https://github.com/commitizen-tools/commitizen'
rev = "v4.16.5"
hooks = [
  {
    id = 'commitizen',
    stages = ['commit-msg']
  },
  {
    id = 'commitizen-branch',
    stages = ['pre-push']
  }
]

[[repos]]
repo = 'https://github.com/rhysd/actionlint'
rev = 'v1.7.12'
hooks = [
  { id = 'actionlint' }
]
