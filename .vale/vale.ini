Packages = proselint, write-good

StylesPath = .
Vocab = project

[formats]
editorconfig = ini

[*]
BasedOnStyles = Vale, proselint, write-good
write-good.E-Prime = NO
write-good.Passive = NO

[*.{editorconfig,ini,json,toml,yaml,yml}]
View = configs

[*.sh]
Vale.Spelling = NO
# Allow "..." in log messages.
proselint.Typography = NO

[*.ts]
View = sources
